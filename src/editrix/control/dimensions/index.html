<template id="editrix-control-dimensions">
  <div class="editrix-borders">
    <div class="editrix-borders-values" v-bind="e.dimensionsTitle()">
      <input type="number" v-bind="e.linkedNumber('top', dimensionSides)">
      <input type="number" v-bind="e.linkedNumber('right', dimensionSides)">
      <input type="number" v-bind="e.linkedNumber('bottom', dimensionSides)">
      <input type="number" v-bind="e.linkedNumber('left', dimensionSides)">
    </div>
    <label class="editrix-borders-buttons">
      <span class="editrix-buttons-item" title="Link sides together" v-bind="e.linkToggle()">
        <i class="ph ph-link"></i>
      </span>
      <select class="editrix-inputs-box" v-bind="e.unitSelect()">
        <option v-each="unit in units" :value="unit" v-text="unit"></option>
      </select>
    </label>
  </div>
</template>
