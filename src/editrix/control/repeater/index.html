<template id="editrix-control-repeater">
  <div class="editrix-repeater">
    <div class="editrix-repeater-list" data-part="list" v-bind="e.repeaterList()"></div>

    <i class="ph ph-caret-double-down" data-part="toggle-all" title="Expand all" v-bind="e.repeaterToggleAll()"></i>

    <button type="button" class="editrix-repeater__add" data-part="add" v-bind="e.repeaterAdd()">
      <i class="ph ph-plus"></i>
      <span>Add item</span>
    </button>
  </div>
</template>

<template id="editrix-repeater-item-template">
  <div class="editrix-repeater-item" data-repeater-item v-bind="e.repeaterItemRoot()">
    <div class="editrix-repeater-item__head" data-part="toggle" v-bind="e.repeaterToggle()">
      <i class="ph ph-dots-six-vertical editrix-repeater-item__handle" title="Drag to reorder"></i>
      <span class="editrix-repeater-item__label" data-part="label" v-bind="e.repeaterLabel()"></span>
      <i class="ph ph-eye editrix-repeater-item__visibility" data-part="visibility" title="Toggle visibility" v-bind="e.repeaterVisibility()"></i>
      <i class="ph ph-trash editrix-repeater-item__remove" data-part="remove" title="Remove item" v-bind="e.repeaterRemove()"></i>
    </div>
    <div class="editrix-repeater-item__body" data-part="body"></div>
  </div>
</template>
