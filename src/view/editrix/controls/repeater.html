<!-- The "repeater" control's own markup (plugins/editrix/controls/repeater.js) — kept in its own
     partial, included once from editrix.html right next to fill.html, for the same reason that one
     is: html-webpack-plugin only wires up require() for templates compiled directly from editrix.html,
     not for a further-nested require() inside sidebar.html's own text. Every part a script needs to
     find/wire is marked with "data-part" (createRepeaterItem()/renderRepeaterControl() in
     repeater.js); a row's own declared fields are appended into "[data-part='body']" at runtime, so
     no fixed shape is baked in here beyond the row chrome itself. -->

<template id="editrix-control-repeater">
  <div class="editrix-repeater">
    <div class="editrix-repeater-list" data-part="list"></div>

    <i class="ph ph-caret-double-down" data-part="toggle-all" title="Expand all"></i>
    <i class="ph ph-plus" data-part="add" title="Add item"></i>
  </div>
</template>

<template id="editrix-repeater-item-template">
  <div class="editrix-repeater-item" data-repeater-item>
    <div class="editrix-repeater-item__head" data-part="toggle">
      <i class="ph ph-dots-six-vertical editrix-repeater-item__handle" title="Drag to reorder"></i>
      <span class="editrix-repeater-item__label" data-part="label"></span>
      <i class="ph ph-caret-down editrix-repeater-item__caret"></i>
      <i class="ph ph-trash editrix-repeater-item__remove" data-part="remove" title="Remove item"></i>
    </div>
    <div class="editrix-repeater-item__body" data-part="body"></div>
  </div>
</template>
