<!-- Toolbox > generic multi-line text control — "v-prop"/"placeholder" are set per-field by
     CONTROL_RENDERERS.textarea (render.js), directly on a top-level reactive property (e.g. "title",
     the "Page" panel's title field), not routed through the block-content settings system — see
     render.js's own comment on why toolbox controls are mounted via renderControl(), not renderField(). -->

<template id="editrix-control-textarea">
  <textarea spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
</template>
