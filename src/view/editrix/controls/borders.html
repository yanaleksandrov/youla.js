<!-- Toolbox > Position section's own "Borders" control — same registry/renderer (render.js) as every
     other control, rendered via renderControl() rather than renderField() (see render.js's own
     comment). detailsAutoClose() is youla-editrix.js's own binding. -->

<template id="editrix-control-borders">
  <div class="editrix-borders">
    <label class="editrix-borders-values" data-title="Borders">
      <input type="number" value="0" v-prop="marginTop" />
      <input type="number" value="0" v-prop="marginEnd" />
      <input type="number" value="0" v-prop="marginBottom" />
      <input type="number" value="0" v-prop="marginStart" />
    </label>

    <details class="editrix-buttons-item" v-bind="e.detailsAutoClose">
      <summary>px</summary>
      <p>
        <label><input type="checkbox" name="ingredient" value="cheese">em</label>
        <label><input type="radio" name="ingredient" value="tomato">rem</label>
      </p>
    </details>
  </div>
</template>
