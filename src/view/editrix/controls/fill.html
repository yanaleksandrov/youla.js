<!-- The "fill" control's own markup (plugins/editrix/controls/fill.js) — kept in its own partial,
     included once from sidebar.html's field template library, so this control's markup never has
     to live mixed into that file's own <template> list. Every part a script needs to find/wire is
     marked with "data-part" (createFillItem()/renderFillControl() in fill.js). -->

<template id="editrix-control-fill">
  <div class="editrix-fill">
    <div class="editrix-fill-list" data-part="list"></div>

    <!-- Relocated into the section's .editrix-section-head by contentFields() (youla-editrix.js) —
         left here, not in .editrix-section-head's own static markup, since only a "fill"-type field
         has one and this template is the only place that knows that. -->
    <i class="ph ph-plus" data-part="add" title="Add solid fill"></i>
  </div>
</template>

<template id="editrix-fill-item-template">
  <div class="editrix-fill-item" data-fill-item>
    <i class="ph ph-dots-six-vertical editrix-fill-item__handle" title="Drag to reorder"></i>
    <input type="text" class="editrix-inputs-box" data-part="filler">
    <i class="ph ph-eye editrix-fill-item__visibility" data-part="visibility" title="Toggle visibility"></i>
    <i class="ph ph-trash editrix-fill-item__remove" data-part="remove" title="Remove fill"></i>
  </div>
</template>
