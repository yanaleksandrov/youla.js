<template id="editrix-control-url">

  <div class="editrix-field-inline">
    <label><input type="checkbox" v-bind="e.partSwitch('is_external')"> Open in new tab</label>
    <label><input type="checkbox" v-bind="e.partSwitch('nofollow')"> Nofollow</label>
  </div>
</template>
